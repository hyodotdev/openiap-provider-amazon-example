name: Verify example

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: openiap-google-amazon-community
      - name: Read OpenIAP input revision
        id: input
        run: echo "revision=$(cat openiap-google-amazon-community/openiap-revision.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: hyodotdev/openiap
          ref: ${{ steps.input.outputs.revision }}
          path: openiap
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"
      - name: Install OpenIAP build inputs
        working-directory: openiap
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Prepare and test public artifacts
        working-directory: openiap-google-amazon-community
        run: node scripts/prepare-openiap.mjs
      - name: Lint provider
        working-directory: openiap-google-amazon-community
        run: ./gradlew -PopenIapRepository="$PWD/.local/maven" :provider:lintRelease
      - name: Check consumer and build optimized Android app
        working-directory: openiap-google-amazon-community/example
        run: |
          bun install --ignore-scripts
          bun run typecheck
          bun run test
          bunx expo prebuild --platform android --no-install
          cd android
          ./gradlew -PreactNativeArchitectures=arm64-v8a -Pandroid.enableMinifyInReleaseBuilds=true :app:assembleRelease
      - name: Stage registry installation inputs
        working-directory: openiap-google-amazon-community
        run: node scripts/registry-inputs.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registry-inputs
          path: openiap-google-amazon-community/.local/registry-inputs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
